name: Update profile cards
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/cards.mjs
        env:
          GH_TOKEN: ${{ secrets.STREAK_TOKEN }}
          LOGIN: faithwekesa
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg streak.svg languages.svg
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push
